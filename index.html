<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>my-courses</title>
</head>

<body>
  <div id="app">
    <h1 class="visually-hidden">Основной заголовок страницы</h1>
    <section class="courses wrapper">
      <p class="courses__slogan">Enjoy your studying!</p>
      <h2 class="courses__title">Our online courses</h2>
      <div class="toolbar" role="toolbar" aria-label="Фильтры и поиск курсов">
        <ul class="toolbar__list filters" role="list" aria-label="Фильтры курсов по категориям"></ul>
        <div class="toolbar__input search">
          <input class="search__input" type="search" name="search-input" placeholder="Search courses..." aria-label="Поиск курсов">
          <span class="search__icon"></span>
        </div>
      </div>
      <div class="catalog">
        <ul class="catalog__list" role="list" aria-label="Список курсов"></ul>
        <button class="catalog__button button">Load more</button>
      </div>
    </section>
    <template id="card-template">
      <li class="catalog__item card">
        <img class="card__image">
        <div class="card__content">
          <p class="card__badge"></p>
          <p class="card__title"></p>
          <div class="card__info">
            <span class="card__price"></span>
            <span class="card__author"></span>
          </div>
        </div>
      </li>
    </template>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
