<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>my-courses</title>
</head>

<body>
  <div id="app">
    <p class="slogan">Enjoy your studying!</p>
    <h1 class="title">Our online courses</h1>
    <header class="header">
      <nav class="header__nav nav">
        <ul class="nav__list filters"></ul>
        <input class="nav__seach">
      </nav>
    </header>
    <div class="catalog">
      <ul class="catalog__list"></ul>
      <button class="catalog__button button">Load more</button>
    </div>
    <template id="card-template">
      <li class="catalog__item card">
        <img class="card__image">
        <div class="card__content">
          <p class="card__badge"></p>
          <p class="card__title"></p>
          <div class="card__info">
            <span class="card__price"></span>
            <span class="card__author"></span>
          </div>
        </div>
      </li>
    </template>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
